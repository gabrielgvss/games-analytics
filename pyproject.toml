[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "games-analytics"
version = "1.0.0"
description = "Análise reproduzível de vendas de videogames e demonstração offline"
requires-python = ">=3.11"
dependencies = [
  "kagglehub==1.0.2",
  "numpy==2.5.3",
  "pandas==3.0.6",
  "scikit-learn==1.9.1",
  "statsmodels==0.15.0",
  "matplotlib==3.11.2",
  "seaborn==0.13.2",
  "nbformat==5.11.1",
  "nbclient==0.11.0",
  "ipykernel==7.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

